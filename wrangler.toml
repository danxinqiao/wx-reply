name = "wx-reply"
main = "src/index.ts"
compatibility_date = "2026-11-12"

[vars]
# 以下变量已迁到 Flagship，保留原配置仅作注释
# 占位 CRON_SECRET = "" 
# GITHUB_REF = "main"
# GITHUB_REPO = "danxinqiao/dsh-runner"
# 占位 GITHUB_TOKEN_FLOW = "" 
# PAGES_WX_URL = "https://stock.gyegt614.top/api/wx/callback"
# RESERVED_30_URL = ""
# 占位 UPSTASH_REDIS_REST_TOKEN = "" 
# UPSTASH_REDIS_REST_URL = "https://supreme-mackerel-128896.upstash.io"
# WORKFLOW_ID = "dsh-agent.yml"
# 占位 WX_PUSH_TOKEN = ""（已废弃，统一使用 CRON_SECRET）
# WX_PUSH_URL = "https://hpbnvpiosrzhgyxbrwpt.supabase.co/functions/v1/wx-push"
# 占位 WECHAT_TOKEN = "" 

[[flagship]]
binding = "TEST_FLAGS"
app_id = "6923e3f6-6566-4196-80c4-8715adcdb461"

# 内部调用：直接走 service binding，不走公网、不需要 URL 兜底
[[services]]
binding = "PAGES"
service = "stock-assessment"

[[routes]]
pattern = "wx.gyegt614.top"
custom_domain = true

[[routes]]
pattern = "wx.danxinqiao.eu.cc"
custom_domain = true

[durable_objects]
bindings = [
  { name = "TASK_SCHEDULER", class_name = "TaskScheduler" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskScheduler"]

[observability.logs]
enabled = true
invocation_logs = true
